<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lateral Line 02：Zeabur｜門修好了，人還在嗎</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F6; --surface:#FFFFFF; --ink:#18212E; --muted:#5B6676;
  --line:#D23B27; --line-soft:#F8DDD8; --gate:#2B63D9; --gate-soft:#DCE6FB;
  --safe:#15855A; --safe-soft:#D8F0E5; --rule:#D3D9E0; --idle:#B6BFCB;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F151D; --surface:#17202B; --ink:#E7ECF2; --muted:#9AA6B5;
    --line:#FF6B54; --line-soft:#3A1F1C; --gate:#729DFF; --gate-soft:#1C2A47;
    --safe:#43C98F; --safe-soft:#15332A; --rule:#2A3543; --idle:#4A5562;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F151D; --surface:#17202B; --ink:#E7ECF2; --muted:#9AA6B5;
  --line:#FF6B54; --line-soft:#3A1F1C; --gate:#729DFF; --gate-soft:#1C2A47;
  --safe:#43C98F; --safe-soft:#15332A; --rule:#2A3543; --idle:#4A5562;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px;line-height:1.75;-webkit-font-smoothing:antialiased;
}
a{color:var(--gate)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gate);outline-offset:3px;border-radius:4px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh;min-height:100dvh}

/* ---------- route rail ---------- */
.rail{
  position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow-y:auto;
  padding:32px 20px 32px 28px;border-right:1px solid var(--rule);background:var(--surface);
}
.rail h2{font-size:15px;font-weight:700;margin:0 0 4px;color:var(--muted)}
.rail .legend{font-size:13px;color:var(--muted);margin:0 0 22px;line-height:1.6}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative;padding-left:34px}
.route li::before{ /* track segment leading into this item */
  content:"";position:absolute;left:9px;top:-2px;bottom:50%;width:6px;border-radius:3px;
  background:var(--idle);transition:background .35s;
}
.route li:first-child::before{display:none}
.route li.on::before{background:var(--line)}
.route li.st{min-height:46px;display:flex;align-items:center}
.route li.st::after{ /* lower half of track */
  content:"";position:absolute;left:9px;top:50%;bottom:-2px;width:6px;border-radius:3px;background:var(--idle);transition:background .35s;
}
.route li.st:last-child::after{display:none}
.route li.st.through::after{background:var(--line)}
.dot{
  position:absolute;left:2px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;
  background:var(--surface);border:4px solid var(--idle);z-index:1;transition:border-color .35s,background .35s;
}
.st.on .dot,.st.start .dot{border-color:var(--line)}
.st.here .dot{background:var(--line)}
.st.cut .dot{border-color:var(--safe);background:var(--safe)}
.st.cut .dot::before,.st.cut .dot::after{
  content:"";position:absolute;left:50%;top:50%;width:10px;height:2px;background:var(--surface);
  transform:translate(-50%,-50%) rotate(45deg);
}
.st.cut .dot::after{transform:translate(-50%,-50%) rotate(-45deg)}
.st .nm{font-size:15px;font-weight:500;color:var(--muted);line-height:1.35}
.st.on .nm,.st.start .nm{color:var(--ink)}
.st.here .nm{font-weight:900}
.st.cut .nm{color:var(--safe);font-weight:700}
.route li.gate{min-height:34px;display:flex;align-items:center}
.route li.gate::after{
  content:"";position:absolute;left:9px;top:50%;bottom:-2px;width:6px;border-radius:3px;background:var(--idle);transition:background .35s;
}
.route li.gate.on::after{background:var(--line)}
.gate .bar{
  position:absolute;left:-4px;top:50%;width:32px;height:6px;margin-top:-3px;border-radius:3px;background:var(--gate);z-index:1;
}
.gate .nm{font-size:12.5px;color:var(--gate);font-weight:700;letter-spacing:.02em}

/* ---------- main ---------- */
main{display:flex;flex-direction:column;min-width:0}
.screen{flex:1;padding:56px clamp(20px,6vw,72px) 32px;max-width:820px;width:100%}
.screen:focus{outline:none}
.kicker{font-size:14px;color:var(--muted);margin:0 0 6px}
h1{font-size:clamp(40px,7vw,76px);line-height:1.08;font-weight:900;letter-spacing:-.02em;margin:0 0 20px}
h2.t{font-size:clamp(28px,4.2vw,40px);line-height:1.25;font-weight:900;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700;margin:30px 0 6px}
p{margin:0 0 14px;max-width:36em}
.lead{font-size:19px;max-width:32em}
.muted{color:var(--muted)}
.time{display:inline-block;font-size:14px;color:var(--line);background:var(--line-soft);padding:2px 10px;border-radius:6px;margin:0 0 18px}
.analogy{border-left:4px solid var(--gate);padding:4px 0 4px 16px;margin:20px 0;color:var(--muted);max-width:34em}
.note{background:var(--gate-soft);padding:12px 16px;border-radius:8px;margin:18px 0;max-width:36em;font-size:16px}
.pocket{margin:26px 0 4px;padding:14px 16px;border:1px dashed var(--line);border-radius:10px;max-width:36em}
.pocket b{display:block;font-size:14px;color:var(--line);margin-bottom:6px}
.pocket ol{margin:0;padding-left:1.4em;font-size:15.5px}
.pocket li{color:var(--muted)}
.pocket li.new{color:var(--ink);font-weight:700}
.def{list-style:none;padding:0;margin:6px 0 0;max-width:36em}
.def li{position:relative;padding:8px 0 8px 64px;border-top:1px solid var(--rule)}
.def li:first-child{border-top:none}
.who{position:absolute;left:0;top:10px;font-size:13px;font-weight:700;padding:1px 8px;border-radius:5px;background:var(--safe-soft);color:var(--safe)}
.who.u{background:var(--gate-soft);color:var(--gate)}

/* game */
.checks{list-style:none;padding:0;margin:18px 0;max-width:38em}
.checks li{border-top:1px solid var(--rule)}
.checks label{display:flex;gap:14px;align-items:flex-start;padding:12px 4px;cursor:pointer}
.checks input{width:22px;height:22px;margin-top:4px;accent-color:var(--safe);flex:none}
.checks small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
.result{border-radius:10px;padding:16px 18px;margin:8px 0 0;max-width:38em;background:var(--line-soft)}
.result.ok{background:var(--safe-soft)}
.result strong{display:block;font-size:18px;margin-bottom:4px}
.result p{margin:6px 0 0;font-size:16px}

/* layers */
.layers{list-style:none;padding:0;margin:20px 0;max-width:40em}
.layers>li{display:grid;grid-template-columns:7.5em 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--rule)}
.layers h4{margin:0;font-size:17px;font-weight:900;line-height:1.4}
.layers h4 span{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.layers ul{margin:0;padding-left:1.1em;font-size:16px}
.layers li li{margin-bottom:4px}

/* quiz */
.q{margin:26px 0;max-width:38em}
.q h3{font-size:18px;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;padding:12px 16px;border-radius:10px;border:2px solid var(--rule);background:var(--surface);cursor:pointer;line-height:1.5;
}
.opt:hover:not(:disabled){border-color:var(--gate)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--safe);background:var(--safe-soft)}
.opt.wrong{border-color:var(--line);background:var(--line-soft)}
.explain{font-size:15.5px;color:var(--muted);margin:10px 0 0}
.score{font-size:20px;font-weight:900;margin:10px 0}

/* end */
.takeaways{counter-reset:t;list-style:none;padding:0;margin:20px 0;max-width:38em}
.takeaways li{position:relative;padding:10px 0 10px 44px;border-top:1px solid var(--rule)}
.takeaways li::before{counter-increment:t;content:counter(t);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;background:var(--line);color:#fff;font-weight:900;font-size:15px;display:grid;place-items:center}
.src{font-size:15px;padding-left:1.2em}

/* nav */
.controls{
  position:sticky;bottom:0;display:flex;align-items:center;gap:14px;
  padding:14px clamp(20px,6vw,72px) calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--paper);border-top:1px solid var(--rule);
}
.btn{
  min-height:52px;padding:0 26px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:17px;cursor:pointer;
}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.3;cursor:default}
.dots{flex:1;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--idle)}
.dots span.done{background:var(--line)}
.dots span.now{background:var(--ink);transform:scale(1.35)}
.inline-btn{margin-top:18px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;z-index:5;height:auto;border-right:none;border-bottom:1px solid var(--rule);padding:12px 16px 10px;overflow-x:auto;overflow-y:hidden}
  .rail h2,.rail .legend{display:none}
  .route{display:flex;align-items:flex-start;width:max-content;padding-right:16px}
  .route li{padding-left:0;padding-top:30px;min-height:0!important;display:block!important;width:78px;text-align:center}
  .route li.gate{width:46px}
  .route li::before{left:-2px;right:50%;top:12px;bottom:auto;width:auto;height:6px}
  .route li.st::after,.route li.gate::after{left:50%;right:-2px;top:12px;bottom:auto;width:auto;height:6px}
  .dot{left:50%;top:5px;margin:0 0 0 -10px}
  .gate .bar{left:50%;top:0;width:6px;height:30px;margin:0 0 0 -3px}
  .st .nm{font-size:11.5px;display:block;padding:0 2px}
  .gate .nm{font-size:10.5px;display:block;line-height:1.25}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .screen{padding-top:32px}
  .layers>li{grid-template-columns:1fr;gap:6px}
  .btn{padding:0 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.route li.r::before{background:var(--line)}
.route li.g::before{background:var(--safe)}
.route li.st.ar::after{background:var(--line)}
.route li.st.ag::after{background:var(--safe)}
.st.dirty .dot{border-color:var(--line)}
.st.here2 .dot{border-color:var(--line);background:var(--line)}
.st.clean .dot{border-color:var(--safe);background:var(--safe)}
.st.dirty .nm{color:var(--ink)}
.st.here2 .nm{color:var(--ink);font-weight:900}
.st.clean .nm{color:var(--safe);font-weight:700}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:1px 8px;border-radius:5px;margin-right:6px;vertical-align:2px}
.tag.ok{background:var(--safe-soft);color:var(--safe)}
.tag.no{background:var(--line-soft);color:var(--line)}
.tag.gen{background:var(--gate-soft);color:var(--gate)}
.facts{list-style:none;padding:0;margin:10px 0;max-width:38em}
.facts li{padding:9px 0;border-top:1px solid var(--rule);font-size:16px}
.facts li:first-child{border-top:none}
.cmp{width:100%;max-width:40em;border-collapse:collapse;margin:14px 0;font-size:15.5px}
.cmp th,.cmp td{text-align:left;vertical-align:top;padding:9px 10px;border-top:1px solid var(--rule)}
.cmp th{font-weight:700;color:var(--muted);width:6em}
.cmp thead th{border-top:none;color:var(--ink)}
.tbl{overflow-x:auto}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="後門藏身處地圖">
    <h2>後門藏身處地圖</h2>
    <p class="legend"><i style="background:var(--line)"></i>可能藏著後門　<i style="background:var(--safe)"></i>已清查</p>
    <ol class="route" id="route"></ol>
  </aside>
  <main>
    <section class="screen" id="screen" tabindex="-1" aria-live="polite"></section>
    <nav class="controls">
      <button class="btn" id="prev">上一步</button>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="btn primary" id="next">下一步</button>
    </nav>
  </main>
</div>

<script>
const LINE01 = 'https://claude.ai/artifact/3ruWcSokBXGDcwQhR3CTch';

const NODES = [
  {id:0, nm:'已修補的入口'},
  {id:1, nm:'雲端帳號'},
  {id:2, nm:'叢集控制面'},
  {id:3, nm:'主機'},
  {id:4, nm:'網路通道'},
  {id:5, nm:'供應鏈'},
  {id:6, nm:'身分與工作階段'},
  {id:7, nm:'攻擊者回來'}
];

const SPOTS = [
  {
    nm:'雲端帳號',
    hide:'新建一個名字看起來很正常的 IAM 使用者或 access key；在某個既有 Role 的信任政策裡，偷偷加上攻擊者自己的 AWS 帳號；或放一個定時觸發的 Lambda，每天替他開一次門。',
    why:'名字可以取得像內部服務，長期金鑰不會過期，而且一個用了幾年的雲端帳號裡，本來就有一堆沒人記得是誰建的資源。',
    case:[['ok','8 月時攻擊者確實拿到 AWS root，並列舉了雲端資源。'],['gen','官方報告沒有提到是否在 AWS 留下後門。']],
    clean:['從 CloudTrail 拉出攻擊時段內所有建立、修改、附加權限的呼叫，逐一回滾。','用 IAM Access Analyzer 找出所有「信任外部帳號」的 Role。','最乾淨的做法：開一個新帳號，從可信的程式碼重新部署，舊帳號整個廢棄。']
  },
  {
    nm:'叢集控制面',
    hide:'建一個 ServiceAccount 綁上高權限；放一個 CronJob 或 DaemonSet 定期回連；註冊一個 admission webhook，讓之後每個新建的 Pod 都被自動塞進惡意容器；或者直接把 ServiceAccount token、kubeconfig 帶走。',
    why:'K8s 裡的物件數量龐大，系統元件本身就會建一堆 ServiceAccount 和 RoleBinding，多一個很難一眼看出來。',
    case:[['ok','8 月報告記載：攻擊者在東京共享叢集建立了異常的一次性工作，並把一個服務帳號授予叢集管理員權限。'],['ok','事後官方移除了「已識別」的異常叢集授權，並汰換了共享叢集主機。'],['ok','10 月攻擊者持有共享叢集的平台管理憑證，從哪裡來的，官方尚未公布。']],
    note:'注意「已識別」這三個字。清除只能清掉你找得到的東西，沒被識別出來的，就不會被移除。',
    clean:['回放 K8s audit log，列出攻擊者建立或修改過的每一個物件。','叢集狀態由 Git 宣告（GitOps），任何不在 repo 裡的物件都視為異常。','輪替 ServiceAccount token 的簽章金鑰；真的不確定，就整個叢集重建。']
  },
  {
    nm:'主機',
    hide:'在 authorized_keys 加一把自己的公鑰；新增系統使用者；用 cron 或 systemd 放一個開機就會執行的服務；改 sshd 設定。',
    why:'公鑰只是一行文字，混在一堆金鑰裡很難看出來；名字取得好的話，連看到的人都會以為是同事放的。',
    case:[['ok','10 月官方狀態頁要求 Google Cloud 專用伺服器的用戶更改 root 密碼，並移除不認得的 SSH 金鑰，特別是標成 zeabur-pentest 的那一把。']],
    note:'zeabur-pentest 這個名字，看起來像是「Zeabur 內部做滲透測試用的」。把後門偽裝成自己人留下的東西，是很典型的潛伏手法。',
    clean:['不在原機上清，直接用乾淨的映像檔重建主機。','SSH 改用短期憑證（SSH CA），沒有長期有效的公鑰可以藏。','authorized_keys 由設定管理工具統一下發，有偏差就告警。']
  },
  {
    nm:'網路通道',
    hide:'在 VPN 或 WireGuard 上多加一個 peer；在防火牆或安全群組多開一條規則；或讓某個容器主動往外連到攻擊者的伺服器，建立反向通道。',
    why:'重建時大家通常只重建「被打進去的那一邊」。但通道有兩頭，另一頭在核心系統那裡，而核心常被當成受害者，沒有跟著重建。',
    case:[['ok','8 月的路徑經過共享叢集連回核心的私有網路，官方表示已切斷這條路徑。'],['no','未證實：8 月時有暗網賣家宣稱握有仍可使用的 WireGuard 連線，官方只確認攻擊者是從叢集取得 VPN 存取。']],
    clean:['核心端的 VPN peer、防火牆規則全部清空，依白名單重新建立。','換掉 VPN 的金鑰，不沿用任何舊設定。','出站流量也要管：只允許連到已知目的地（egress allowlist），反向通道就連不出去。']
  },
  {
    nm:'供應鏈',
    hide:'在 base image、部署腳本或 CI workflow 裡加幾行；或偷走 GitHub token、CI secrets，之後隨時能改程式碼、觸發部署。',
    why:'後門會跟著每一次正常部署被重新裝回去。你把機器全部重建了，部署流程又親手把它放回來。',
    case:[['no','未證實：8 月的暗網賣家宣稱握有 GitHub PAT 與原始碼；官方表示現有證據無法佐證整批資料外洩的說法。']],
    clean:['從可信的 commit 重建映像檔，並簽章驗證。','輪替所有 CI/CD secrets、deploy key 與個人存取權杖。','檢查 workflow 檔案與分支保護設定的變更歷史。']
  },
  {
    nm:'身分與工作階段',
    hide:'偷走登入用的簽章金鑰，自己簽一張有效的登入憑證；保留還沒撤銷的平台 API token；在管理員帳號上加一個 MFA 裝置或授權的 OAuth app；或直接控制員工電腦。',
    why:'這些都不是「入侵」，而是「合法登入」。在系統眼裡，攻擊者就是一個正常使用者。',
    case:[['ok','10 月官方輪替了工作階段簽章金鑰，所有用戶都必須重新登入。'],['ok','8 月報告提到已完成相關員工裝置與開發環境的安全自查。'],['no','未證實：外界有管理者電腦遭駭的說法，官方沒有證實。']],
    clean:['輪替所有簽章金鑰，撤銷全部 session 和 token。','檢查每個管理員帳號綁定的 MFA 裝置、OAuth app 和登入紀錄。','員工裝置用 EDR 檢查；只要有疑慮，就直接重灌。']
  }
];

const ACTIONS = [
  {id:'c1', nm:'修補已知的入侵路徑', sub:'修好入口、輪替已知外洩的憑證', cleans:[]},
  {id:'c2', nm:'用新帳號、新叢集重建，舊環境整個廢棄', sub:'從可信程式碼重新部署', cleans:[1,2,3]},
  {id:'c3', nm:'清查雲端帳號的身分與權限', sub:'CloudTrail 回滾、找出對外信任的 Role', cleans:[1]},
  {id:'c4', nm:'比對叢集狀態與 Git 宣告', sub:'不在 repo 裡的 RBAC、CronJob、Webhook 全刪', cleans:[2]},

function cleanedSet(){
  const s = new Set();
  ACTIONS.forEach(a=>{ if(state.checked[a.id]) a.cleans.forEach(c=>s.add(c)) });
  return s;
}
function gameStates(){
  const c = cleanedSet(), st = {0:'clean'};
  for(let i=1;i<=6;i++) st[i] = c.has(i)?'clean':'dirty';
  st[7] = c.size===6 ? 'clean' : 'dirty';
  return st;
}
function paint(st, focus){
  const lis = [...routeEl.children];
  lis.forEach((li,i)=>{
    li.className='st';
    const s = st[i];
    if(s) li.classList.add(s==='here'?'here2':s);
    if(s==='dirty'||s==='here') li.classList.add('r');
    if(s==='clean' && i>0) li.classList.add('g');
    const nx = st[i+1];
    if(nx==='dirty'||nx==='here') li.classList.add('ar');
    else if(nx==='clean') li.classList.add('ag');
  });
  const t = focus!=null ? lis[focus] : null;
  if(t && window.matchMedia('(max-width:860px)').matches){
    t.scrollIntoView({inline:'center',block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  }
}

const TAGNAME = {ok:'官方確認', no:'未證實', gen:'未提及'};
function spotScreen(i){

    html:()=>`

function gameResult(){
  const c = cleanedSet();
  const any = ACTIONS.some(a=>state.checked[a.id]);
  const left = SPOTS.map((s,i)=>({nm:s.nm,i:i+1})).filter(x=>!c.has(x.i));
  if(!any) return {ok:false, html:`<strong>還沒有任何清理動作</strong><p>六個地方都可能藏著後門。試著勾選你會做的事。</p>`};
  if(c.size===0) return {ok:false, html:`<strong>入口修好了，但六個地方都沒清</strong><p>這是最常見的結案方式，也最容易被同一個人再進來一次。攻擊者如果早就留了後門，他回來時根本不需要走原本那條路。</p>`};
  if(!left.length) return {ok:true, html:`<strong>六個藏身處都清過了</strong><p>這不保證百分之百乾淨，但攻擊者想回來，就得重新找一條新的路，而不是用他留下的鑰匙直接開門。</p>${state.checked.c1?'':'<p>別忘了，原本的入口也要修。不然他會從同一扇窗戶再爬進來一次。</p>'}`};
  return {ok:false, html:`<strong>還有 ${left.length} 個地方沒清：${left.map(x=>x.nm).join('、')}</strong><p>只要其中一處藏著後門，攻擊者就能回來，而且不必再走一次第一課那七站。</p>${c.has(1)&&c.has(2)&&c.has(3)&&!c.has(4)?'<p>你重建了被打進去的那一邊，但通道的另一頭在核心系統，那裡還沒動。</p>':''}`};
}

const screenEl=document.getElementById('screen');
const prevBtn=document.getElementById('prev'), nextBtn=document.getElementById('next');
const dotsEl=document.getElementById('dots');
if(state.idx<0||state.idx>=SCREENS.length) state.idx=0;

function render(resetScroll=true){
  const s=SCREENS[state.idx];
  screenEl.innerHTML=s.html();
  paint(s.states(), s.focus);
  if(s.after) s.after();
  prevBtn.disabled=state.idx===0;
  nextBtn.textContent=state.idx===0?'開始':state.idx===SCREENS.length-1?'回到起點':'下一步';
  dotsEl.innerHTML=SCREENS.map((_,i)=>`<span class="${i<state.idx?'done':i===state.idx?'now':''}"></span>`).join('');
  if(resetScroll){window.scrollTo(0,0); screenEl.focus({preventScroll:true})}
}
function go(d){
  state.idx = d>0&&state.idx===SCREENS.length-1 ? 0 : Math.max(0,Math.min(SCREENS.length-1,state.idx+d));
  save(); render();
}
prevBtn.addEventListener('click',()=>go(-1));
nextBtn.addEventListener('click',()=>go(1));
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,button,a')) return;
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
render();
</script>
</body>
</html>
